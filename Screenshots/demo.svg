<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="864" viewBox="0 0 1180 864">
<rect width="1180" height="864" rx="12" fill="#0b1120"/>
<circle cx="24" cy="22" r="6" fill="#ef4444"/><circle cx="44" cy="22" r="6" fill="#f59e0b"/><circle cx="64" cy="22" r="6" fill="#22c55e"/>
<text x="590.0" y="27" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">swift&#160;run&#160;GitignoreClaimDemo&#160;(excerpt&#160;of&#160;real&#160;output;&#160;full&#160;text&#160;in&#160;demo-output.txt)</text>
<text x="20" y="58" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">GitignoreClaimKit&#160;demo:&#160;what&#160;answers&#160;say&#160;about&#160;.gitignore,&#160;checked&#160;with&#160;git's&#160;own&#160;matching&#160;rules</text>
<text x="20" y="76" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start"></text>
<text x="20" y="94" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">==&#160;1.&#160;Keeping&#160;one&#160;file&#160;in&#160;an&#160;ignored&#160;folder</text>
<text x="20" y="112" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">--&#160;answer:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="130" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;path:&#160;`logs/keep.log`&#160;is&#160;ignored:&#160;`logs/`&#160;excludes&#160;its&#160;directory&#160;`logs/`,&#160;so&#160;the&#160;claim&#160;that&#160;it&#160;is&#160;kept&#160;is&#160;wrong.&#160;git&#160;cannot&#160;re-include&#160;a&#160;file&#160;inside</text>
<text x="20" y="148" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;an&#160;excluded&#160;directory,&#160;so&#160;the&#160;`!`&#160;line&#160;has&#160;no&#160;effect.&#160;Write&#160;`logs/*`&#160;instead,&#160;so&#160;the&#160;directory&#160;stays&#160;open&#160;and&#160;the&#160;`!`&#160;line&#160;can&#160;work.</text>
<text x="20" y="166" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ignored&#160;&#160;logs/keep.log&#160;&lt;-&#160;`logs/`&#160;(line&#160;1)&#160;via&#160;excluded&#160;logs/</text>
<text x="20" y="184" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">--&#160;rewrite:&#160;verified&#160;(2&#160;claims&#160;checked,&#160;2&#160;hold)</text>
<text x="20" y="202" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ok&#160;&#160;&#160;&#160;path:&#160;Right:&#160;`logs/keep.log`&#160;is&#160;not&#160;ignored:&#160;`!logs/keep.log`&#160;re-includes&#160;it.</text>
<text x="20" y="220" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ok&#160;&#160;&#160;&#160;path:&#160;Right:&#160;`logs/app.log`&#160;is&#160;ignored&#160;by&#160;`logs/*`.</text>
<text x="20" y="238" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;kept&#160;&#160;&#160;&#160;&#160;logs/keep.log&#160;&lt;-&#160;`!logs/keep.log`&#160;(line&#160;2)</text>
<text x="20" y="256" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start"></text>
<text x="20" y="274" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">==&#160;2.&#160;A&#160;comment&#160;after&#160;a&#160;pattern</text>
<text x="20" y="292" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">--&#160;answer:&#160;wrong&#160;(2&#160;claims&#160;checked,&#160;0&#160;hold,&#160;2&#160;wrong)</text>
<text x="20" y="310" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;line:&#160;`.build/&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;#&#160;build&#160;products`&#160;does&#160;not&#160;ignore&#160;`.build/`.&#160;git&#160;reads&#160;`#`&#160;as&#160;a&#160;comment&#160;only&#160;at&#160;the&#160;start&#160;of&#160;a&#160;line,&#160;so&#160;the&#160;comment&#160;is&#160;part&#160;of</text>
<text x="20" y="328" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;pattern.&#160;Put&#160;`.build/`&#160;on&#160;its&#160;own&#160;line&#160;and&#160;the&#160;comment&#160;on&#160;the&#160;line&#160;above.</text>
<text x="20" y="346" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;path:&#160;`.build/debug/App.o`&#160;is&#160;not&#160;ignored:&#160;no&#160;line&#160;matches&#160;it,&#160;so&#160;the&#160;claim&#160;that&#160;it&#160;is&#160;ignored&#160;is&#160;wrong.&#160;git&#160;reads&#160;`#`&#160;as&#160;a&#160;comment&#160;only&#160;at&#160;the&#160;start</text>
<text x="20" y="364" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;of&#160;a&#160;line,&#160;so&#160;the&#160;comment&#160;is&#160;part&#160;of&#160;the&#160;pattern.&#160;Put&#160;`.build/`&#160;on&#160;its&#160;own&#160;line&#160;and&#160;the&#160;comment&#160;on&#160;the&#160;line&#160;above.</text>
<text x="20" y="382" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;kept&#160;&#160;&#160;&#160;&#160;.build/debug/App.o</text>
<text x="20" y="400" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start"></text>
<text x="20" y="418" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">==&#160;3.&#160;Where&#160;a&#160;pattern&#160;matches</text>
<text x="20" y="436" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">--&#160;answer:&#160;wrong&#160;(5&#160;claims&#160;checked,&#160;2&#160;hold,&#160;3&#160;wrong)</text>
<text x="20" y="454" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;scope:&#160;`*.log`&#160;matches&#160;at&#160;every&#160;level,&#160;not&#160;only&#160;the&#160;top&#160;(`sub/x.log`&#160;is&#160;matched).&#160;A&#160;pattern&#160;with&#160;no&#160;slash&#160;(other&#160;than&#160;a&#160;trailing&#160;one)&#160;matches&#160;at</text>
<text x="20" y="472" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;every&#160;level.&#160;`/*.log`&#160;does&#160;what&#160;the&#160;answer&#160;expects.</text>
<text x="20" y="490" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;path:&#160;`doc/server/arch.txt`&#160;is&#160;not&#160;ignored:&#160;no&#160;line&#160;matches&#160;it,&#160;so&#160;the&#160;claim&#160;that&#160;it&#160;is&#160;ignored&#160;is&#160;wrong.&#160;`*`&#160;does&#160;not&#160;match&#160;`/`;&#160;`**`&#160;does.</text>
<text x="20" y="508" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;`doc/**/*.txt`&#160;does&#160;what&#160;the&#160;answer&#160;expects.</text>
<text x="20" y="526" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;scope:&#160;`config/secrets.json`&#160;does&#160;not&#160;match&#160;at&#160;any&#160;depth&#160;(`sub/config/secrets.json`&#160;is&#160;not&#160;matched).&#160;A&#160;slash&#160;at&#160;the&#160;start&#160;or&#160;in&#160;the&#160;middle&#160;anchors&#160;a</text>
<text x="20" y="544" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;pattern&#160;to&#160;the&#160;directory&#160;of&#160;its&#160;.gitignore.&#160;`**/config/secrets.json`&#160;does&#160;what&#160;the&#160;answer&#160;expects.</text>
<text x="20" y="562" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ok&#160;&#160;&#160;&#160;scope:&#160;Right:&#160;`/build`&#160;matches&#160;only&#160;at&#160;the&#160;top&#160;level&#160;(`sub/build`).</text>
<text x="20" y="580" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ok&#160;&#160;&#160;&#160;path:&#160;Right:&#160;`build`&#160;is&#160;ignored&#160;by&#160;`/build`.</text>
<text x="20" y="598" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ignored&#160;&#160;logs/debug/app.log&#160;&lt;-&#160;`*.log`&#160;(line&#160;1)</text>
<text x="20" y="616" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;kept&#160;&#160;&#160;&#160;&#160;doc/server/arch.txt</text>
<text x="20" y="634" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;ignored&#160;&#160;doc/readme.txt&#160;&lt;-&#160;`doc/*.txt`&#160;(line&#160;2)</text>
<text x="20" y="652" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start"></text>
<text x="20" y="670" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">==&#160;4.&#160;A&#160;trailing&#160;slash,&#160;and&#160;**&#160;between&#160;slashes</text>
<text x="20" y="688" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">--&#160;answer:&#160;wrong&#160;(3&#160;claims&#160;checked,&#160;0&#160;hold,&#160;3&#160;wrong)</text>
<text x="20" y="706" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;path:&#160;`build`&#160;is&#160;not&#160;ignored:&#160;no&#160;line&#160;matches&#160;it,&#160;so&#160;the&#160;claim&#160;that&#160;it&#160;is&#160;ignored&#160;is&#160;wrong.&#160;A&#160;pattern&#160;ending&#160;in&#160;`/`&#160;matches&#160;only&#160;directories.&#160;`build`</text>
<text x="20" y="724" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;does&#160;what&#160;the&#160;answer&#160;expects.</text>
<text x="20" y="742" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;path:&#160;`a/b`&#160;is&#160;ignored&#160;by&#160;`a/**/b`,&#160;so&#160;the&#160;claim&#160;that&#160;it&#160;is&#160;kept&#160;is&#160;wrong.&#160;`/**/`&#160;matches&#160;zero&#160;or&#160;more&#160;directories.</text>
<text x="20" y="760" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;path:&#160;`.env`&#160;is&#160;ignored&#160;by&#160;`*.env`,&#160;so&#160;the&#160;claim&#160;that&#160;it&#160;is&#160;kept&#160;is&#160;wrong.&#160;In&#160;.gitignore&#160;`*`&#160;also&#160;matches&#160;a&#160;leading&#160;dot.</text>
<text x="20" y="778" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start"></text>
<text x="20" y="796" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">==&#160;5.&#160;Ignoring&#160;a&#160;file&#160;that&#160;is&#160;already&#160;committed</text>
<text x="20" y="814" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">--&#160;answer:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="832" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start">&#160;&#160;&#160;WRONG&#160;tracking:&#160;Adding&#160;a&#160;path&#160;to&#160;.gitignore&#160;does&#160;not&#160;untrack&#160;a&#160;file&#160;git&#160;already&#160;tracks.&#160;Ignore&#160;rules&#160;apply&#160;only&#160;to&#160;untracked&#160;files:&#160;a&#160;committed&#160;file&#160;stays</text>
</svg>
